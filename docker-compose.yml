services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infra}
      POSTGRES_DB: ${POSTGRES_DB:-infra_requirements}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infra} -d ${POSTGRES_DB:-infra_requirements}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://infra:infra@db:5432/infra_requirements?schema=public}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      # Uncomment to share the VM's /etc/hosts with the container
      # (so oVirt/RHEV hostnames resolved on the host also resolve inside the pod):
      - /etc/hosts:/etc/hosts:ro
    # Or, list individual host overrides here (kept in sync manually):
    # extra_hosts:
    #   - "ovirt.example.com:10.0.12.50"
    #   - "rhev-mgr.lab.local:10.0.12.51"
    ports:
      - "3000:3000"

volumes:
  db_data:
  uploads:
